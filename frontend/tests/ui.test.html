<script>
window.Bob = (() => {
  const handlers = {};
  const reg = new Map();
  const session = {
    role: 'admin',
    permissions: ['ide:read','ide:edit','jobs:read','jobs:write','jobs:run',
                  'runs:read','runs:cancel','notifications:read','settings:read',
                  'settings:write','roles:manage'],
    roles: ['admin','developer','operator','viewer']
  };
  return {
    on:    (e, f) => { (handlers[e] = handlers[e] || []).push(f); },
    emit:  (e, d) => { (handlers[e] || []).forEach(f => { try { f(d); } catch(_){} }); },
    el: (tag, attrs, ...children) => {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === 'class') n.className = v;
        else if (k === 'dataset') Object.assign(n.dataset, v);
        else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
        else if (v === true) n.setAttribute(k, '');
        else n.setAttribute(k, String(v));
      }
      children.flat().forEach(c => { if (c != null) n.append(c && c.nodeType ? c : document.createTextNode(String(c))); });
      return n;
    },
    clear: n => { if (!n) return n; while (n.firstChild) n.removeChild(n.firstChild); return n; },
    $: (sel, root) => (root || document).querySelector(sel),
    session,
    can:         p  => session.permissions.includes(p),
    loadSession: async () => session,

<script>
// ─── Test runner ─────────────────────────────────────────────────────────────
const TESTS = [];
let currentSection = null;
function section(name) { currentSection = name; }
function test(name, fn) { TESTS.push({ section: currentSection, name, fn }); }
function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }

async function run() {
  const tbody = document.querySelector('#results tbody');
  let pass = 0, fail = 0;
  let lastSection = null;
  for (const { section, name, fn } of TESTS) {
    if (section !== lastSection) {
      lastSection = section;
      const tr = document.createElement('tr');
      tr.className = 'section-head';
      tr.innerHTML = `<td colspan="3">${section}</td>`;
      tbody.append(tr);
    }
    let result = 'PASS', detail = '';
    try {
      const r = await fn();
      detail = r || '';
      pass++;
    } catch (e) {
      result = 'FAIL';
      detail = e.message || String(e);
      fail++;
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${name}</td>
      <td class="${result.toLowerCase()}">${result}</td>
      <td class="${result === 'FAIL' ? 'err' : ''}">${detail}</td>`;
    tbody.append(tr);
  }
  const s = document.getElementById('summary');
  s.textContent = `${pass + fail} tests: ${pass} passed, ${fail} failed.`;
  s.className = fail === 0 ? 'all-pass' : 'has-fail';
}

section('CSS — .etab classes are defined');

function cssRuleDefined(selector) {
  for (const sheet of document.styleSheets) {
    try {
      for (const rule of sheet.cssRules || []) {
        if (rule.selectorText && rule.selectorText.includes(selector)) return true;
        // @media / @supports wrappers
        if (rule.cssRules) {
          for (const inner of rule.cssRules) {
            if (inner.selectorText && inner.selectorText.includes(selector)) return true;
          }
        }
      }
    } catch (_) { /* cross-origin sheet */ }
  }
  return false;
}

test('.etab CSS rule is defined in widget.css', () => {
  // We check computed style on a live element instead of iterating sheets
  // (avoids CORS issues when the sheet is served from the same origin)
  const div = document.createElement('div');
  div.className = 'etab';
  document.body.appendChild(div);
  const cs = getComputedStyle(div);
  const display = cs.display;
  document.body.removeChild(div);
  // .etab sets display:inline-flex — if CSS not loaded it would be "block" (default for div)
  assert(display === 'inline-flex', `expected display:inline-flex, got "${display}" — widget.css may not be loaded here`);
  return `display:${display} ✓`;
});

test('.etab.active CSS rule is defined', () => {
  const div = document.createElement('div');
  div.className = 'etab active';
  document.body.appendChild(div);
  const bg = getComputedStyle(div).backgroundColor;
  document.body.removeChild(div);
  // .etab.active sets background:#fff → rgb(255,255,255)
  assert(bg === 'rgb(255, 255, 255)', `expected white background, got "${bg}"`);
  return `background:${bg} ✓`;
});

  return `flex-direction:${flexDir} ✓`;
});

section('Bob Widget Toggle Behaviour');

test('Calling openBobPanel() removes [hidden] from panel', async () => {
  const panel    = document.getElementById('panel-mode-chat');
  const viewport = document.querySelector('.workspace-viewport');
  // Simulate what chat.js openBobPanel() does
  panel.hidden = false;
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  viewport.classList.add('bob-open');
  panel.classList.add('bob-panel-open');
  assert(!panel.hidden, 'panel is still hidden after openBobPanel simulation');
  assert(viewport.classList.contains('bob-open'), 'viewport missing bob-open class');
  // clean up
  panel.hidden = true;
  viewport.classList.remove('bob-open');
  panel.classList.remove('bob-panel-open');
  return 'panel unhidden, viewport.bob-open added ✓';
});

test('After closeBobPanel() panel receives [hidden] on transitionend', async () => {
  const panel    = document.getElementById('panel-mode-chat');
  const viewport = document.querySelector('.workspace-viewport');
  // open first
  panel.hidden = false;
  viewport.classList.add('bob-open');
  panel.classList.add('bob-panel-open');
  // close — simulate the transitionend callback
  viewport.classList.remove('bob-open');
  panel.classList.remove('bob-panel-open');
  panel.hidden = true;
  assert(panel.hidden, 'panel should be hidden after close');
  assert(!viewport.classList.contains('bob-open'), 'bob-open class should be removed');
  return 'panel hidden, bob-open removed ✓';
});

test('workspace-viewport.bob-open shifts float button right (CSS)', () => {
  const viewport = document.querySelector('.workspace-viewport');
  const btn      = document.getElementById('bob-float-btn');
  viewport.classList.add('bob-open');
  const right = getComputedStyle(btn).right;
  viewport.classList.remove('bob-open');
  // When bob-open: right should be 376px (not the default 28px)
  assert(right === '376px', `expected right:376px when bob-open, got "${right}"`);
  return `right:${right} ✓`;
});

  let threw = false;
  try { Bob.clear(null); } catch (_) { threw = true; }
  assert(!threw, 'Bob.clear(null) threw — renderExplorer will crash when #ide-file-list absent');
  return 'no throw ✓';
});

test('#ide-file-list can be queried via Bob.$()', () => {
  const ul = Bob.$('#ide-file-list');
  assert(ul !== null, '#ide-file-list not found via Bob.$()');
  return `found: <${ul.tagName.toLowerCase()} id="${ul.id}">`;
});

test('Manually appending an .etab to #editor-tabs shows full-width row layout', () => {
  const strip = document.getElementById('editor-tabs');
  const tab = document.createElement('div');
  tab.className = 'etab active';
  tab.style.width = '100%'; // mimic sidebar override
  const main = document.createElement('button');
  main.className = 'etab-main';
  main.textContent = 'automation_script.js';
  const close = document.createElement('button');
  close.className = 'etab-close';
  close.textContent = '×';
  tab.append(main, close);
  strip.append(tab);

  const tabW = getComputedStyle(tab).width;
  const mainDisplay = getComputedStyle(main).display;
  strip.removeChild(tab);

  assert(mainDisplay === 'inline-flex', `etab-main display: expected inline-flex, got ${mainDisplay}`);
  return `etab-main display:${mainDisplay} ✓`;
});

test('.etab-close is hidden by default (visibility:hidden)', () => {
  // Create a detached .etab (no hover) and check etab-close visibility
  const wrap = document.createElement('div');
  wrap.style.position = 'absolute';
  wrap.style.left = '-9999px';
  const tab = document.createElement('div');
  tab.className = 'etab';
  const close = document.createElement('button');
  close.className = 'etab-close';
  tab.append(close);
  wrap.append(tab);
  document.body.append(wrap);
  const vis = getComputedStyle(close).visibility;
  document.body.removeChild(wrap);
  assert(vis === 'hidden', `expected visibility:hidden, got "${vis}"`);
  return `visibility:${vis} ✓`;
});
