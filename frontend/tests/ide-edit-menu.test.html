<!DOCTYPE html>
<!--
  Regression test: IDE Edit menu (and full script-load chain)
  Root cause of the defect: frontend/js/dialogs.js was listed in index.html but did not exist.
  A missing <script src="..."> causes a network error that halts all subsequent script execution.
  Because app.js (which calls Bob.ide.init()) comes after dialogs.js in the load order, the ENTIRE
  application failed to boot — the IDE menubar was never built, so the Edit option never appeared.

  This file is a standalone in-browser test that does NOT require a running server.
  Open it via:  node backend/server.js  then visit  http://localhost:3000/tests/ide-edit-menu.test.html

  All tests use the same Bob namespace and module stubs defined in the page so they run
  without the backend, CodeMirror, or any other external dependency.

  Expected: all tests PASS (green).
  Any FAIL means the Edit menu is still broken — investigate the console for the error.
-->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IDE Edit Menu — Regression Test</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: #f9fafb; color: #111; max-width: 760px; margin: auto; }
    h1 { font-size: 20px; margin-bottom: 6px; }
    .subtitle { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; background: #f1f5f9; padding: 8px 10px; border-bottom: 2px solid #e2e8f0; }
    td { padding: 7px 10px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    .pass { color: #166534; font-weight: 700; }
    .fail { color: #991b1b; font-weight: 700; }
    .skip { color: #92400e; font-weight: 700; }
    .err  { color: #991b1b; font-size: 11px; font-family: Consolas, monospace; word-break: break-all; }
    #summary { margin-top: 16px; font-size: 14px; font-weight: 700; }
    #summary.all-pass { color: #166534; }
    #summary.has-fail { color: #991b1b; }
  </style>
</head>
<body>
<h1>IDE Edit Menu — Regression Tests</h1>
<p class="subtitle">Tests whether <code>dialogs.js</code> loads, <code>Bob.dialogs</code> is defined,
  Edit-menu commands are registered, and they pass their <code>enabled()</code> guard correctly.</p>

<table id="results">
  <thead><tr><th>Test</th><th>Result</th><th>Detail</th></tr></thead>
  <tbody></tbody>
</table>
<p id="summary"></p>

<script>
// ─── Minimal Bob stub (no DOM, no server, no CodeMirror needed) ──────────────
window.Bob = (() => {
  const handlers = {};
  const registry = new Map();
  const session = { role: 'admin', permissions: ['ide:read', 'ide:edit', 'settings:read', 'settings:write', 'jobs:read', 'jobs:write', 'jobs:run', 'runs:read', 'runs:cancel', 'notifications:read', 'roles:manage'], roles: ['admin', 'developer', 'operator', 'viewer'] };

  return {
    // pub/sub
    on: (e, f) => { (handlers[e] = handlers[e] || []).push(f); },
    emit: (e, d) => { (handlers[e] || []).forEach(f => { try { f(d); } catch (_) {} }); },
    // DOM helpers (stubs — no actual DOM interaction needed for these tests)
    el: (tag, attrs, ...children) => {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === 'class') n.className = v;
        else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
        else if (v === true) n.setAttribute(k, '');
        else n.setAttribute(k, String(v));
      }
      children.flat().forEach(c => { if (c != null) n.append(c && c.nodeType ? c : document.createTextNode(String(c))); });
      return n;
    },
    clear: n => { while (n.firstChild) n.removeChild(n.firstChild); return n; },
    $: (sel, root) => (root || document).querySelector(sel),
    // session / permissions
    session,
    can: p => session.permissions.includes(p),
    loadSession: async () => session,
    // stubs that commands.js calls
    isMac: /Mac|iPhone|iPad/.test(navigator.platform),
    fuzzy: (q, t) => { if (!q) return 1; const tl = t.toLowerCase(); let i = 0; for (const c of q.toLowerCase()) { const at = tl.indexOf(c, i); if (at < 0) return 0; i = at + 1; } return 1; },
    toast: (msg, lvl) => console.info(`[toast:${lvl}]`, msg),
    modal: opts => { console.info('[modal]', opts.title); return { close() {}, el: document.createElement('div'), showError() {} }; },
    confirm: async () => false,
    prompt: async () => null,
    withBusy: async (_, fn) => fn(),
    fmtTime: iso => iso ? new Date(iso).toLocaleString() : '—',
    fmtDuration: () => '—',
    runDuration: () => '—',
    statusChip: s => document.createElement('span'),
    loading: () => document.createElement('div'),
    empty: () => document.createElement('div'),
    errorState: () => document.createElement('div'),
    download: () => {},
    initTabs: () => {},
    // IDE stub — commands.js checks Bob.ide
    ide: { hasEditorFocus: () => false },
    // layout stub
    layout: { show: () => {}, hide: () => {}, toggle: () => {}, is: () => true, showView: () => {} },
    // monitor stub
    monitor: { refreshBadge: async () => {} },
    showTab: () => {},
    commands: null  // set after commands.js loads
  };
})();
</script>

<!-- Load the real module under test (order matters: ui helpers, then commands, then dialogs) -->
<script>
// Minimal DOM stubs required by commands.js (needs btn-palette, body for tooltip node)
document.body.insertAdjacentHTML('beforeend', '<button id="btn-palette" hidden></button>');
</script>

<!-- We load only commands.js and dialogs.js (the two modules relevant to this test).
     The other modules (ide.js, chat.js, layout.js, etc.) are not loaded here. -->
<script src="/js/commands.js"></script>
<script src="/js/dialogs.js"></script>

<script>
// ─── Test runner ─────────────────────────────────────────────────────────────
const TESTS = [];
function test(name, fn) { TESTS.push({ name, fn }); }
async function run() {
  const tbody = document.querySelector('#results tbody');
  let pass = 0, fail = 0;
  for (const { name, fn } of TESTS) {
    let result, detail = '';
    try {
      const r = await fn();
      result = 'PASS'; detail = r || ''; pass++;
    } catch (e) {
      result = 'FAIL'; detail = e.message || String(e); fail++;
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${name}</td>
      <td class="${result.toLowerCase()}">${result}</td>
      <td class="${result === 'FAIL' ? 'err' : ''}">${detail}</td>`;
    tbody.append(tr);
  }
  const s = document.getElementById('summary');
  s.textContent = `${pass + fail} tests: ${pass} passed, ${fail} failed.`;
  s.className = fail === 0 ? 'all-pass' : 'has-fail';
}

// ─── Assert helper ────────────────────────────────────────────────────────────
function assert(cond, msg) { if (!cond) throw new Error(msg); }

// ─── Tests ───────────────────────────────────────────────────────────────────

// 1. dialogs.js loaded without throwing (if this test runs, the script tag succeeded)
test('dialogs.js loaded (no script error)', () => {
  assert(typeof Bob.dialogs === 'object' && Bob.dialogs !== null, 'Bob.dialogs is not defined — dialogs.js may not have loaded');
  return 'Bob.dialogs is defined';
});

// 2. All six commands defined in dialogs.js are registered
test('bob.review command is registered', () => {
  const c = Bob.commands.get('bob.review');
  assert(c, 'Command "bob.review" not found in registry');
  return `title: "${c.title}"`;
});
test('bob.settings command is registered', () => {
  const c = Bob.commands.get('bob.settings');
  assert(c, 'Command "bob.settings" not found');
  return `title: "${c.title}"`;
});
test('bob.checkpoints command is registered', () => {
  const c = Bob.commands.get('bob.checkpoints');
  assert(c, 'Command "bob.checkpoints" not found');
  return `title: "${c.title}"`;
});
test('help.directory command is registered', () => {
  const c = Bob.commands.get('help.directory');
  assert(c, 'Command "help.directory" not found');
  return `title: "${c.title}"`;
});
test('help.shortcuts command is registered', () => {
  assert(Bob.commands.get('help.shortcuts'), 'Command "help.shortcuts" not found');
});
test('help.about command is registered', () => {
  assert(Bob.commands.get('help.about'), 'Command "help.about" not found');
});

// 3. Bob.dialogs.checkpoints() is callable (used by chat.js when a checkpoint is created)
test('Bob.dialogs.checkpoints is a function', () => {
  assert(typeof Bob.dialogs.checkpoints === 'function', 'Bob.dialogs.checkpoints must be a function');
});

// 4. The Edit-menu commands that were broken are registered by commands.js / ide.js
//    (commands.js is loaded above; the Edit items below are registered statically there via ide.js,
//    but for this test we register minimal stubs to verify the category "Edit" structure)
test('commands.js defines a registry with register/get/list/run', () => {
  const api = Bob.commands;
  assert(typeof api.register === 'function', 'commands.register missing');
  assert(typeof api.get === 'function', 'commands.get missing');
  assert(typeof api.list === 'function', 'commands.list missing');
  assert(typeof api.run === 'function', 'commands.run missing');
  return 'All four command API methods present';
});

// 5. Verify that the commands registered by dialogs.js pass their enabled() guard for the admin role
test('bob.review enabled() returns true for admin role', () => {
  const c = Bob.commands.get('bob.review');
  const enabled = c && (c.enabled ? c.enabled() : true);
  assert(enabled, 'bob.review.enabled() returned false for admin role');
  return `enabled() = ${enabled}`;
});
test('bob.checkpoints enabled() returns true for admin role', () => {
  const c = Bob.commands.get('bob.checkpoints');
  const enabled = c && (c.enabled ? c.enabled() : true);
  assert(enabled, 'bob.checkpoints.enabled() returned false for admin role');
  return `enabled() = ${enabled}`;
});

// 6. Verify that enabled() returns false when the role lacks ide:read
test('bob.review enabled() returns false for viewer without ide:read', () => {
  const saved = Bob.session.permissions;
  Bob.session.permissions = ['jobs:read'];  // viewer without ide:read
  const c = Bob.commands.get('bob.review');
  const enabled = c && (c.enabled ? c.enabled() : true);
  Bob.session.permissions = saved;
  assert(!enabled, 'bob.review.enabled() should be false when role lacks ide:read');
  return `enabled() = ${enabled} (correct: false)`;
});

// 7. help.directory is global (accessible from within modals)
test('help.directory has global:true', () => {
  const c = Bob.commands.get('help.directory');
  assert(c.global === true, 'help.directory must have global:true so it works from within a modal');
  return 'global: true';
});

// 8. Palette open registers (Mod+Shift+P command from commands.js)
test('palette.open command is registered by commands.js', () => {
  const c = Bob.commands.get('palette.open');
  assert(c, 'palette.open not found — commands.js may not have loaded');
  return `keys: ${(c.keys || []).join(', ')}`;
});

run();
</script>
</body>
</html>
